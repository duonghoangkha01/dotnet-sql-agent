# Serves the web build and proxies /api to the API on the compose network, so the browser sees one origin
# (no CORS, no build-time API address). Listens on 8080 because the image runs as a non-root user.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The model's text is shown as plain text; the CSP is the second line of defence if that ever slips:
    # nothing can load from, or send data to, another origin.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The chat stream is server-sent events: nothing may buffer it, and a slow model must not hit a short timeout.
    # The API adds X-Accel-Buffering: no and sends a ": ping" comment every 15 s while idle.
    # The address is resolved per request (variable + Docker's DNS), so recreating the api container does not leave
    # nginx pointing at its old IP.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed assets never change, but index.html names them: always revalidate it so a redeploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
