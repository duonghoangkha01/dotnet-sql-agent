name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit like the container images; the comment names the tag it was resolved from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SqlAgent.sln
      - run: dotnet build SqlAgent.sln -c Release --no-restore
      - run: dotnet test tests/SqlAgent.Core.Tests -c Release --no-build
      # The database grants are generated from semantic.yaml. Regenerating must change nothing: a YAML edit
      # without a regenerated grants file fails here. Needs no database.
      - name: Grants drift check
        run: |
          dotnet run --project src/SqlAgent.Cli -c Release --no-build -- emit-grants
          git diff --exit-code -- deploy/sql/40-role-grants.generated.sql
      # The template values pass compose's required-variable checks; nothing is started.
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f compose.gpu.yml config -q
          docker compose -f docker-compose.yml -f compose.dev.yml config -q

  # The chat UI: typecheck + production build, then the parser, reducer and rendering tests.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      # The nginx config (CSP, SSE settings) only runs inside the image: build it and let nginx parse the config.
      - name: Build the web image and check the nginx config
        working-directory: .
        run: |
          docker build -f web/Dockerfile -t sqlagent-web .
          docker run --rm sqlagent-web nginx -t

  # Row-level security, per-role grants, the executor and the pooled-connection behavior can only be tested against
  # a real SQL Server. The tests start one in a container (the image pinned in docker-compose.yml), restore
  # AdventureWorks and replay deploy/sql, exactly as the compose stack bootstraps it.
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      # The ~200 MB backup is downloaded once and cached. The key changes with deploy/fetch-bak.sh, which holds its checksum.
      - name: Point the tests at the cached backup
        run: echo "SQLAGENT_TEST_BAK=$RUNNER_TEMP/adventureworks/AdventureWorks2022.bak" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/adventureworks
          key: adventureworks-2022-bak-${{ hashFiles('deploy/fetch-bak.sh') }}
      - run: dotnet test tests/SqlAgent.IntegrationTests -c Release
